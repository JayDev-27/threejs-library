<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Threejs scroll showcases</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/showcase.css">
</head>
<body class="loading">
<canvas id="gl"></canvas>
<div id="veil"><div class="veil-in"><span id="v-glyph"></span><b id="v-title"></b><i id="v-sub"></i><div class="bar"><s></s></div></div></div>
<header id="hud">
  <a class="back" href="index.html"><img src="logo.svg" alt="" width="18" height="18">Library</a>
  <span class="tag"><b id="h-n"></b><span id="h-name"></span></span>
</header>
<nav id="dots"></nav>
<div id="progress"><s></s></div>
<div id="hint">Scroll</div>
<main id="story"></main>
<script type="module">
import { mount, SCENES } from './lib/engine.js';
history.scrollRestoration = 'manual';
const q = new URLSearchParams(location.search), id = q.get('s') || 'nature';
const def = SCENES.find(s => s.id === id) || SCENES[0], idx = SCENES.indexOf(def), next = SCENES[(idx + 1) % SCENES.length];
const $ = s => document.querySelector(s), root = document.documentElement;
document.title = `${def.title} · ${def.name} · Threejs scroll showcases`;
const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = def.font.url; document.head.append(link);
root.style.setProperty('--display', def.font.display); root.style.setProperty('--body', def.font.body);
root.style.setProperty('--bg', def.colors.bg); root.style.setProperty('--ink', def.colors.ink); root.style.setProperty('--accent', def.colors.accent);
document.body.dataset.theme = def.id;
$('#v-glyph').textContent = def.glyph; $('#v-title').textContent = def.title; $('#v-sub').textContent = def.sub;
$('#h-n').textContent = def.n; $('#h-name').textContent = def.name;

const story = $('#story'), dots = $('#dots');
def.chapters.forEach((c, i) => {
  const s = document.createElement('section'); s.className = 'ch ' + (i === 0 ? 'hero' : i % 2 ? 'right' : 'left');
  s.innerHTML = i === 0
    ? `<div class="copy"><span class="glyph">${def.glyph}</span><p class="k">${c.k}</p><h1>${def.title}</h1><p class="lead">${c.t}. ${c.b}</p></div>`
    : `<div class="copy"><p class="k">${c.k}</p><h2>${c.t}</h2><p>${c.b}</p></div>`;
  story.append(s);
  const d = document.createElement('button'); d.title = c.k; d.onclick = () => scrollTo({ top: journey() * i / (def.chapters.length - 1), behavior: 'smooth' });
  dots.append(d);
});
const end = document.createElement('section'); end.className = 'ch outro';
end.innerHTML = def.id === 'suzume'
  ? `<div class="copy"><p class="k">Flagship Sanctuary</p><a class="next" href="/" style="margin-bottom:14px;background:var(--accent);color:var(--bg);"><span>✧</span>Open Full Sanctuary (/)<em>→</em></a><p class="k">Next showcase</p><a class="next" href="showcase.html?s=${next.id}"><span>${next.n}</span>${next.title}<em>→</em></a><a class="lib" href="index.html">Back to the library</a></div>`
  : `<div class="copy"><p class="k">Next showcase</p><a class="next" href="showcase.html?s=${next.id}"><span>${next.n}</span>${next.title}<em>→</em></a><a class="lib" href="index.html">Back to the library</a></div>`;
story.append(end);

const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('in', e.isIntersecting)), { rootMargin: '-35% 0px -35% 0px' });
document.querySelectorAll('.ch').forEach(s => io.observe(s));

const bar = $('#progress s'), N = def.chapters.length;
// the outro section sits after the story: the 3D journey ends where the last chapter is centred
const journey = () => Math.max(1, story.scrollHeight - innerHeight - end.offsetHeight * 0.75);
const progress = () => Math.min(1, Math.max(0, scrollY / journey()));
window.__go = p => scrollTo(0, journey() * p);
// frame-cost probe: await __perf(0.3) -> { ms per frame, triangles and draw calls per frame }
window.__perf = async (p, secs = 2) => { const w = window.__world, I = w.renderer.info; if (p != null) { __go(p); await new Promise(r => setTimeout(r, 2500)); }
  I.autoReset = false; const ts = []; let tri = 0, calls = 0, n = 0; await new Promise(done => { const t0 = performance.now(); let last = t0; const f = now => { ts.push(now - last); last = now; tri += I.render.triangles; calls += I.render.calls; n++; I.reset(); now - t0 < secs * 1000 ? requestAnimationFrame(f) : done(); }; I.reset(); requestAnimationFrame(f); });
  I.autoReset = true; ts.shift(); ts.sort((a, b) => a - b); return { p: +w.progress.toFixed(2), ms: +(ts.reduce((a, b) => a + b, 0) / ts.length).toFixed(1), p95: +ts[Math.floor(ts.length * 0.95)].toFixed(1), tris: Math.round(tri / n), calls: Math.round(calls / n), q: +w.quality.toFixed(2) }; };
function onScroll() { const p = progress(); bar.style.transform = `scaleX(${p})`;
  const a = Math.round(p * (N - 1)); [...dots.children].forEach((d, i) => d.classList.toggle('on', i === a));
  document.body.classList.toggle('scrolled', scrollY > 40); }
addEventListener('scroll', onScroll, { passive: true }); onScroll();

if (q.has('clean')) document.body.classList.add('clean');
mount($('#gl'), def.id, q.has('autoplay') ? { autoplay: +q.get('autoplay') || 60 } : { progress }).then(world => { window.__world = world;
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('loading')));
}).catch(e => { $('#v-sub').textContent = e.message; console.error(e); });
</script>
</body>
</html>
